name: Test timing measurement
on:
  push:
    branches: [test/canvas-budget]
permissions:
  contents: read
jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.2'
          cache: true
      - name: Measure unchanged Canvas tests
        run: |
          set -o pipefail
          go test -race -json -count=1 -timeout=600s ./internal/canvas | tee "$RUNNER_TEMP/canvas-timing.jsonl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canvas-timing
          path: ${{ runner.temp }}/canvas-timing.jsonl
